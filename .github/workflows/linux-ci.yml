name: Format Validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: format-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and OME validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out ScopeWriter
        uses: actions/checkout@v7

      - name: Set up vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/scopewriter-vcpkg"
          git -C "$RUNNER_TEMP/scopewriter-vcpkg" checkout "$(jq -r '."builtin-baseline"' vcpkg.json)"
          "$RUNNER_TEMP/scopewriter-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
          echo "VCPKG_ROOT=$RUNNER_TEMP/scopewriter-vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-x64-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-linux-

      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DSCOPEWRITER_BUILD_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Write sample outputs
        run: build/ScopeWriterTests "$RUNNER_TEMP/outputs"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate against OME-TIFF and OME-NGFF
        run: |
          python -m pip install -r tests/requirements.txt
          python tests/validate_outputs.py "$RUNNER_TEMP/outputs"
