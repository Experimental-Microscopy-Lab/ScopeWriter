name: Compile Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feature/ome-validation

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Visual Studio 2022
            build_dir: build-vs
            generator: Visual Studio 17 2022
            configure_args: -A x64
            build_args: --config Release
          - name: Ninja with MSVC
            build_dir: build-ninja
            generator: Ninja
            configure_args: -DCMAKE_BUILD_TYPE=Release
            build_args: ""

    steps:
      - name: Check out ScopeWriter
        uses: actions/checkout@v7

      - name: Set up MSVC
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and [Environment]::GetEnvironmentVariable($Matches[1]) -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP\scopewriter-vcpkg"
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout $baseline
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          $binaryCache = "$env:RUNNER_TEMP\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-x64-windows-

      - name: Configure
        run: cmake -S . -B "${{ matrix.build_dir }}" -G "${{ matrix.generator }}" ${{ matrix.configure_args }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DSCOPEWRITER_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" ${{ matrix.build_args }} --parallel
