name: Compile Check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Visual Studio 2022
            build_dir: build-vs
            generator: Visual Studio 17 2022
            configure_args: -A x64
            build_args: --config Release
          - name: Ninja with MSVC
            build_dir: build-ninja
            generator: Ninja
            configure_args: -DCMAKE_BUILD_TYPE=Release
            build_args: ""

    steps:
      - name: Check out ScopeWriter
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B "${{ matrix.build_dir }}" -G "${{ matrix.generator }}" ${{ matrix.configure_args }} -DSCOPEWRITER_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build "${{ matrix.build_dir }}" ${{ matrix.build_args }} --parallel
